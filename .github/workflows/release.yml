name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystores
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystores/bareuang-release.keystore

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Run lint quality gate
        run: ./gradlew lint --no-daemon

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/keystores/bareuang-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          CODE="${{ github.run_number }}"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
          APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK size: ${APK_SIZE} bytes"
          test "$APK_SIZE" -le 25000000
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Bareuang-v1.0-${CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/Bareuang-latest.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Bareuang v1.0 (build ${{ github.run_number }})
          body: |
            Build manual via GitHub Actions.
            - Commit: ${{ github.sha }}
            - versionCode: ${{ github.run_number }}
            - SHA-256: lihat `SHA256SUMS.txt` pada release artifact.
          files: dist/*
