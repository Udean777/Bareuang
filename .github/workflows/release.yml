name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystores
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystores/barebudget-release.keystore

      - name: Run unit tests
        run: ./gradlew test --no-daemon --continue

      - name: Build signed APK & AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystores/barebudget-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Rename artifacts (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BareBudget-v${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/BareBudget-v${VERSION}.aab"

      - name: Rename artifacts (main branch — rolling latest)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/BareBudget-latest.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/BareBudget-latest.aab

      - name: Upload to GitHub Release (stable, dari tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Upload to GitHub Release (prerelease "latest", dari main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (main)
          prerelease: true
          files: dist/*
          body: |
            Build otomatis dari branch `main` (commit ${{ github.sha }}).
            Aset di-replace setiap merge — unduh `BareBudget-latest.*` terbaru.

      - name: Upload artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BareBudget-release
          path: dist/*
