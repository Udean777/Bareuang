name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version to publish, for example 1.0.0
        required: true
        type: string

concurrency:
  group: bareuang-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate version code
        id: version_code
        env:
          PLAY_VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ! [[ "$PLAY_VERSION_CODE_BASE" =~ ^[0-9]+$ ]] || ! [[ "$WORKFLOW_RUN_NUMBER" =~ ^[0-9]+$ ]] || (( 10#$PLAY_VERSION_CODE_BASE < 1 )); then
            echo "Set the PLAY_VERSION_CODE_BASE repository variable to the highest versionCode already uploaded to Play."
            exit 1
          fi

          VERSION_CODE=$((10#$PLAY_VERSION_CODE_BASE + WORKFLOW_RUN_NUMBER))
          if (( VERSION_CODE > 2100000000 )); then
            echo "Generated versionCode exceeds the Google Play maximum: ${VERSION_CODE}"
            exit 1
          fi

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Generated versionCode: ${VERSION_CODE}"

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Reject an existing release tag
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          tag="v${VERSION_NAME}"
          set +e
          git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "Release tag ${tag} already exists"
              exit 1
              ;;
            2)
              echo "Release tag ${tag} is available"
              ;;
            *)
              echo "Could not verify whether release tag ${tag} exists"
              exit 1
              ;;
          esac

      - name: Validate and decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Missing SIGNING_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          mkdir -p keystores
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystores/bareuang-release.keystore
          test -s keystores/bareuang-release.keystore
          keytool -list -keystore keystores/bareuang-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Run unit tests and lint
        run: ./gradlew test lint --no-daemon

      - name: Validate web JavaScript and SEO
        run: |
          node --check web/js/main.js
          node --check web/js/i18n.js
          node --check web/api/download.js
          node web/test/seo-check.mjs

      - name: Build signed AAB and sideload APK
        env:
          VERSION_CODE: ${{ steps.version_code.outputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_FILE: ${{ github.workspace }}/keystores/bareuang-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Verify release signatures and collect artifacts
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystores/bareuang-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ steps.version_code.outputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -s "$AAB" ]; then
            echo "AAB is missing or empty: $AAB"
            exit 1
          fi
          if [ ! -s "$APK" ]; then
            echo "APK is missing or empty: $APK"
            exit 1
          fi

          echo "Verifying AAB JAR signature (certificate trust warnings may be reported for a self-signed upload key)."
          JARSIGNER_LOG="$RUNNER_TEMP/jarsigner-verify.log"
          if jarsigner -verify -certs "$AAB" >"$JARSIGNER_LOG" 2>&1; then
            if grep -q "internal inconsistencies" "$JARSIGNER_LOG"; then
              echo "jarsigner reported its informational JarFile/JarInputStream consistency warning for the AAB."
            fi
            echo "AAB JAR signature verification passed."
          else
            verify_exit=$?
            echo "AAB JAR signature verification failed with exit code $verify_exit."
            tail -n 40 "$JARSIGNER_LOG"
            exit "$verify_exit"
          fi

          echo "Verifying APK signature."
          if apksigner verify --verbose "$APK"; then
            echo "APK signature verification passed."
          else
            verify_exit=$?
            echo "APK signature verification failed with exit code $verify_exit."
            exit "$verify_exit"
          fi

          echo "Comparing release certificate fingerprints."
          if ! EXPECTED_CERT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}'); then
            echo "Could not read the expected certificate for alias '$KEY_ALIAS'. Check KEYSTORE_FILE, KEYSTORE_PASSWORD, and KEY_ALIAS."
            exit 1
          fi
          if ! AAB_CERT=$(keytool -printcert -jarfile "$AAB" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}'); then
            echo "Could not read the signing certificate from the AAB."
            exit 1
          fi
          if ! APK_CERT=$(apksigner verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{print toupper($2); exit}'); then
            echo "Could not read the signing certificate from the APK."
            exit 1
          fi
          if [ -z "$EXPECTED_CERT" ] || [ -z "$AAB_CERT" ] || [ -z "$APK_CERT" ]; then
            echo "A signing certificate fingerprint is missing (keystore/AAB/APK)."
            exit 1
          fi
          if [ "$EXPECTED_CERT" != "$AAB_CERT" ]; then
            echo "AAB signing certificate does not match the configured keystore alias."
            exit 1
          fi
          if [ "$EXPECTED_CERT" != "$APK_CERT" ]; then
            echo "APK signing certificate does not match the configured keystore alias."
            exit 1
          fi
          echo "AAB and APK certificates match the configured release key."

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          if [ -z "$ZIPALIGN" ]; then
            echo "Could not find zipalign under $ANDROID_HOME/build-tools."
            exit 1
          fi
          echo "Checking APK alignment with $ZIPALIGN."
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          APK_SIZE=$(stat -c%s "$APK")
          echo "Release APK size: ${APK_SIZE} bytes"
          if [ "$APK_SIZE" -gt 60000000 ]; then
            echo "Release APK exceeds the 60 MB size limit: ${APK_SIZE} bytes"
            exit 1
          fi

          mkdir -p dist
          cp "$AAB" "dist/Bareuang-v${VERSION_NAME}-${VERSION_CODE}.aab"
          cp "$APK" "dist/Bareuang-v${VERSION_NAME}-${VERSION_CODE}.apk"
          cp "$APK" dist/Bareuang-latest.apk
          sha256sum dist/*.aab dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version_name }}
          name: Bareuang v${{ inputs.version_name }}
          body: |
            Signed release artifacts built from commit ${{ github.sha }}.
            - versionCode: ${{ steps.version_code.outputs.version_code }}
            - Upload the AAB to Google Play Console.
            - SHA-256 checksums are included in `SHA256SUMS.txt`.
          files: dist/*
