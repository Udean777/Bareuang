name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version to publish, for example 1.0.0
        required: true
        type: string
      version_code:
        description: Positive integer greater than the latest version uploaded to Play
        required: true
        type: number

concurrency:
  group: bareuang-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Reject an existing release tag
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          tag="v${VERSION_NAME}"
          set +e
          git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "Release tag ${tag} already exists"
              exit 1
              ;;
            2)
              echo "Release tag ${tag} is available"
              ;;
            *)
              echo "Could not verify whether release tag ${tag} exists"
              exit 1
              ;;
          esac

      - name: Validate and decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Missing SIGNING_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          mkdir -p keystores
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystores/bareuang-release.keystore
          test -s keystores/bareuang-release.keystore
          keytool -list -keystore keystores/bareuang-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Run unit tests and lint
        run: ./gradlew test lint --no-daemon

      - name: Validate web JavaScript and SEO
        run: |
          node --check web/js/main.js
          node --check web/js/i18n.js
          node --check web/api/download.js
          node web/test/seo-check.mjs

      - name: Build signed AAB and sideload APK
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_FILE: ${{ github.workspace }}/keystores/bareuang-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Verify release signatures and collect artifacts
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystores/bareuang-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$AAB"
          test -s "$APK"
          jarsigner -verify -certs "$AAB"
          apksigner verify --verbose "$APK"

          EXPECTED_CERT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')
          AAB_CERT=$(keytool -printcert -jarfile "$AAB" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')
          APK_CERT=$(apksigner verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{print toupper($2); exit}')
          test -n "$EXPECTED_CERT" && test "$EXPECTED_CERT" = "$AAB_CERT"
          test -n "$EXPECTED_CERT" && test "$EXPECTED_CERT" = "$APK_CERT"

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          APK_SIZE=$(stat -c%s "$APK")
          echo "Release APK size: ${APK_SIZE} bytes"
          if [ "$APK_SIZE" -gt 60000000 ]; then
            echo "Release APK exceeds the 60 MB size limit: ${APK_SIZE} bytes"
            exit 1
          fi

          mkdir -p dist
          cp "$AAB" "dist/Bareuang-v${VERSION_NAME}-${VERSION_CODE}.aab"
          cp "$APK" "dist/Bareuang-v${VERSION_NAME}-${VERSION_CODE}.apk"
          cp "$APK" dist/Bareuang-latest.apk
          sha256sum dist/*.aab dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version_name }}
          name: Bareuang v${{ inputs.version_name }}
          body: |
            Signed release artifacts built from commit ${{ github.sha }}.
            - versionCode: ${{ inputs.version_code }}
            - Upload the AAB to Google Play Console.
            - SHA-256 checksums are included in `SHA256SUMS.txt`.
          files: dist/*
