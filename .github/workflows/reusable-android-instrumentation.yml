name: Reusable Android instrumentation

on:
  workflow_call:
    inputs:
      artifact-name-prefix:
        description: Prefix used for per-API instrumentation report artifacts
        required: true
        type: string

permissions:
  contents: read

jobs:
  instrumentation:
    name: Instrumentation tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 36
            target: google_atd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build instrumentation test APKs
        run: ./gradlew :data:assembleDebug :data:assembleDebugAndroidTest :presentation:assembleDebug :presentation:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2

      - name: Enable and verify KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "KVM device is unavailable on this runner"; exit 1; }
          test -r /dev/kvm && test -w /dev/kvm || { echo "KVM device is not accessible to the runner user"; ls -l /dev/kvm; exit 1; }
          ls -l /dev/kvm

      - name: Run Android instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          cores: 2
          disable-animations: true
          script: bash scripts/ci/run-android-instrumentation.sh
        env:
          EXPECTED_API_LEVEL: ${{ matrix.api-level }}

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name-prefix }}-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
